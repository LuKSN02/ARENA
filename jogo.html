<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Arena — Página do Jogo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171E">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data/theme.css">
<style>
  /* --accent e --glow (defaults em data/theme.css) são sobrescritos via JS
     conforme o jogo da URL — ver document.documentElement.style.setProperty
     mais abaixo. */
  html, body{ background: var(--bg); }
  body{ font-family:'Inter', sans-serif; color: var(--ink); }
  .font-display{ font-family:'Teko', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }

  .clip-card{ clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); }
  .clip-tag{ clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%); }
  .pulse-dot{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.45; transform:scale(.75); } }
  .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ===== CARROSSEL (trilho horizontal com scroll-snap) — mesmo padrão
     usado na home, pra notícias não empilharem verticalmente. ===== */
  .carousel-track{
    display:flex; gap:1.1rem; overflow-x:auto; padding-bottom:6px;
    scroll-snap-type:x proximity; scroll-behavior:smooth;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }
  .carousel-track > *{ scroll-snap-align:start; flex-shrink:0; width:270px; }
  .carousel-track > .carousel-empty{ width:100%; }

  .carousel-head{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; }
  .carousel-arrows{ display:flex; gap:6px; flex-shrink:0; }
  .carousel-arrow{
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border); background:transparent; color: var(--ink-soft);
    font-size:13px; line-height:1; cursor:pointer; transition: border-color .15s ease, color .15s ease, opacity .15s ease;
  }
  .carousel-arrow:hover{ border-color: var(--ink-soft); color: var(--ink); }
  .carousel-arrow:disabled{ opacity:.35; cursor:default; }
  .carousel-arrow:disabled:hover{ border-color: var(--border); color: var(--ink-soft); }

  /* ===== MODAL DE NOTÍCIA ===== */
  #news-backdrop{
    position:fixed; inset:0; z-index:60;
    background: rgba(8,9,13,0.72);
    backdrop-filter: blur(3px);
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  #news-backdrop.open{ opacity:1; pointer-events:auto; }

  #news-modal{
    position:fixed; z-index:61;
    left:50%; top:50%;
    width:min(760px, 92vw);
    max-height:88vh;
    background: var(--panel);
    border:1px solid var(--border);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
    opacity:0;
    transform: translate(-50%, -46%) scale(.96);
    pointer-events:none;
    transition: opacity .28s cubic-bezier(.22,1,.36,1), transform .28s cubic-bezier(.22,1,.36,1);
  }
  #news-modal.open{
    opacity:1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events:auto;
  }
  #news-modal-body{
    max-height: 88vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  #news-modal-body::-webkit-scrollbar{ width:6px; }
  #news-modal-body::-webkit-scrollbar-thumb{ background: var(--accent); }

  body.modal-lock{ overflow:hidden; }

  .modal-p{ line-height:1.75; }
  .comment-avatar{
    width:32px; height:32px; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    background: var(--glow); color: var(--accent); border:1px solid var(--border);
  }
</style>
</head>
<body>

<!-- CABEÇALHO DO JOGO -->
<header style="border-bottom:1px solid var(--border);">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="index.html" class="font-mono text-[12px]" style="color: var(--muted);">&larr; Voltar para a Home</a>
    <nav class="font-mono text-[11px]" style="color: var(--muted);">Notícias / <span id="breadcrumb-game" style="color: var(--ink);">Jogo</span></nav>
  </div>

  <div class="max-w-6xl mx-auto px-4 pb-8">
    <span id="game-tag" class="font-mono text-[11px] font-semibold px-3 py-1 inline-block" style="background: var(--accent); color:#12141A;">JOGO</span>
    <h1 id="game-title" class="font-display text-5xl font-semibold uppercase tracking-wide mt-3" style="color: var(--ink);">Nome do Jogo</h1>
    <p id="game-desc" class="text-sm mt-2 max-w-xl" style="color: var(--ink-soft);">Descrição do jogo.</p>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- NOTÍCIAS DO JOGO -->
    <div class="lg:col-span-2">
      <div class="carousel-head pb-3" style="border-bottom:1px solid var(--border);">
        <h2 class="font-display text-2xl font-semibold uppercase tracking-wide">Últimas notícias</h2>
        <div class="carousel-arrows">
          <button type="button" class="carousel-arrow js-carousel-prev" data-target="news-grid" aria-label="Anterior">‹</button>
          <button type="button" class="carousel-arrow js-carousel-next" data-target="news-grid" aria-label="Próximo">›</button>
        </div>
      </div>
      <div class="carousel-track" id="news-grid"></div>
    </div>

    <!-- SIDEBAR: PRÓXIMAS PARTIDAS -->
    <aside>
      <div class="p-5" style="background: var(--panel); border:1px solid var(--border);">
        <h3 class="mb-4 font-mono text-[13px] font-semibold">📅 PRÓXIMAS PARTIDAS</h3>
        <div class="flex flex-col" id="matches-list"></div>
      </div>
    </aside>

  </div>
</main>

<!-- ===== MODAL DE NOTÍCIA (Abordagem 1: SPA / Expansão dinâmica) ===== -->
<div id="news-backdrop"></div>
<div id="news-modal">
  <div id="news-modal-body">
    <div class="relative h-56" id="modal-hero" style="background: linear-gradient(to bottom right, var(--glow), var(--panel));">
      <button id="modal-close" aria-label="Fechar" class="absolute top-3 right-3 w-9 h-9 flex items-center justify-center font-mono text-lg" style="background: rgba(15,17,22,0.7); color: var(--ink); border:1px solid var(--border);">✕</button>
      <span id="modal-tag" class="clip-tag absolute top-0 left-0 font-mono text-[11px] font-semibold px-4 py-1" style="background: var(--accent); color:#12141A;">JOGO</span>
      <span id="modal-live" class="absolute bottom-3 right-3 hidden items-center gap-1 font-mono text-[10px] font-semibold" style="color: var(--live);">
        <span class="w-1.5 h-1.5 rounded-full pulse-dot" style="background: var(--live);"></span> AO VIVO
      </span>
    </div>

    <div class="p-6 sm:p-8">
      <h2 id="modal-title" class="font-display text-3xl sm:text-4xl font-semibold uppercase tracking-wide leading-none"></h2>
      <div class="flex items-center gap-3 mt-3 font-mono text-[11px]" style="color: var(--muted);">
        <span id="modal-author"></span>
        <span>•</span>
        <span id="modal-date"></span>
        <span>•</span>
        <span id="modal-read"></span>
      </div>

      <div id="modal-content" class="mt-6 space-y-4 text-[15px] modal-p" style="color: var(--ink-soft);"></div>

      <div id="modal-gallery" class="grid grid-cols-2 gap-3 mt-6"></div>

      <!-- COMENTÁRIOS -->
      <div class="mt-10 pt-6" style="border-top:1px solid var(--border);">
        <h3 class="font-mono text-[13px] font-semibold mb-4" style="color: var(--ink);">💬 COMENTÁRIOS (<span id="modal-comment-count">0</span>)</h3>
        <div id="modal-comments" class="flex flex-col gap-4"></div>

        <div class="flex items-start gap-3 mt-6">
          <div class="comment-avatar">EU</div>
          <div class="flex-1">
            <textarea id="modal-comment-input" rows="2" maxlength="280" placeholder="Escreva um comentário..." class="w-full px-3 py-2 text-[13px] resize-none focus:outline-none" style="background: var(--ticker-bg); border:1px solid var(--border); color: var(--ink);"></textarea>
            <div class="flex items-center justify-between mt-2">
              <span id="modal-comment-hint" class="font-mono text-[10px]" style="color: var(--muted);">Ctrl+Enter para publicar</span>
              <button id="modal-comment-submit" class="font-mono text-[11px] font-semibold px-4 py-2" style="background: var(--accent); color:#12141A;">PUBLICAR</button>
            </div>
          </div>
        </div>
      </div>

      <!-- LINK PARA A PÁGINA DEDICADA -->
      <a id="modal-full-link" href="#" class="flex items-center justify-center gap-2 mt-8 py-3 font-mono text-[12px] font-semibold transition hover:opacity-90" style="border:1px solid var(--accent); color: var(--accent);">
        VER MATÉRIA COMPLETA →
      </a>
    </div>
  </div>
</div>

<script src="data/utils.js"></script>
<script src="data/pwa.js"></script>
<script src="data/noticias.js"></script>
<script>
  // ===============================================================
  // SESSÃO + PROGRESSO DE OBJETIVOS (Inventário/Emblemas) — mesma
  // convenção e mesma chave `arena-progress-<email>` que inventario.html
  // lê. Abrir uma notícia aqui conta pros emblemas de leitura/partidas
  // ao vivo, do mesmo jeito que noticia.html (página dedicada) já faz.
  // ===============================================================
  const { getSessionEmail, escapeHtml } = window.ArenaUtils;
  const sessionEmail = getSessionEmail();

  function bumpArenaProgress(key, amount = 1) {
    try {
      const progressKey = `arena-progress-${sessionEmail || "demo"}`;
      const raw = localStorage.getItem(progressKey);
      const progress = raw ? JSON.parse(raw) : {};
      if (!progress.firstVisit) progress.firstVisit = Date.now();
      progress[key] = (progress[key] || 0) + amount;
      localStorage.setItem(progressKey, JSON.stringify(progress));
    } catch (err) { /* silencioso */ }
  }

  // ===============================================================
  // FEED DE ATIVIDADE — mesma chave `arena-activity-<email>` que
  // perfil.html lê para montar a seção "Atividade recente".
  // ===============================================================
  function logArenaActivity(icon, text) {
    try {
      const key = `arena-activity-${sessionEmail || "demo"}`;
      const raw = localStorage.getItem(key);
      const list = raw ? JSON.parse(raw) : [];
      list.unshift({ icon, text, at: Date.now() });
      localStorage.setItem(key, JSON.stringify(list.slice(0, 30)));
    } catch (err) { /* silencioso */ }
  }

  // Evita contar a mesma notícia duas vezes (abrir e fechar o modal
  // repetidas vezes) — soma progresso só na primeira abertura de cada uma.
  function markArticleRead(articleKey, { isLive, title } = {}) {
    try {
      const readKey = `arena-read-articles-${sessionEmail || "demo"}`;
      const already = JSON.parse(localStorage.getItem(readKey) || "[]");
      if (already.includes(articleKey)) return;
      already.push(articleKey);
      localStorage.setItem(readKey, JSON.stringify(already));
      bumpArenaProgress("newsRead");
      if (isLive) bumpArenaProgress("liveMatchesWatched");
      logArenaActivity("📰", `Leu a notícia "${title || "Sem título"}"`);
    } catch (err) { /* silencioso */ }
  }

  // ===============================================================
  // COMENTÁRIOS — persistidos por notícia (`slug:idx`) na mesma chave
  // pra todas as páginas que exibem notícias (jogo.html e noticia.html).
  // Cada comentário publicado soma progresso pro emblema "Comentarista
  // da Arena" (arena-progress → newsComments).
  // ===============================================================
  function commentsStoreKey() {
    return `arena-comments-${sessionEmail || "demo"}`;
  }
  function loadStoredComments(articleKey) {
    try {
      const all = JSON.parse(localStorage.getItem(commentsStoreKey()) || "{}");
      return all[articleKey] || [];
    } catch (err) { return []; }
  }
  function saveStoredComment(articleKey, comment) {
    try {
      const all = JSON.parse(localStorage.getItem(commentsStoreKey()) || "{}");
      all[articleKey] = all[articleKey] || [];
      all[articleKey].push(comment);
      localStorage.setItem(commentsStoreKey(), JSON.stringify(all));
    } catch (err) { /* silencioso */ }
  }

  // ===============================================================
  // Roteamento por query param: jogo.html?jogo=fortnite
  // ===============================================================
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("jogo") || "valorant";
  const game = GAMES[slug] || GAMES.valorant;

  document.documentElement.style.setProperty("--accent", game.accent);
  document.documentElement.style.setProperty("--glow", game.glow);

  document.getElementById("page-title").textContent = `${game.label} — Arena`;
  document.getElementById("breadcrumb-game").textContent = game.label;
  document.getElementById("game-tag").textContent = game.label.toUpperCase();
  document.getElementById("game-title").textContent = game.label;
  document.getElementById("game-desc").textContent = game.desc;

  const newsGrid = document.getElementById("news-grid");
  if (game.news.length === 0) {
    newsGrid.innerHTML = `<p class="carousel-empty font-mono text-[12px] py-10 text-center" style="color: var(--muted);">Nenhuma notícia publicada ainda para ${game.label}.</p>`;
  } else {
    game.news.forEach((n, idx) => {
      const card = document.createElement("a");
      card.href = "#";
      card.dataset.index = idx;
      card.className = "clip-card block cursor-pointer transition hover:opacity-90";
      card.style.background = "var(--panel)";
      card.style.border = "1px solid var(--border)";
      card.innerHTML = `
        <div class="relative h-32" style="background: linear-gradient(to bottom right, var(--glow), var(--panel));">
          ${n.isLive ? `<span class="absolute top-2 right-3 flex items-center gap-1 font-mono text-[10px] font-semibold" style="color: var(--live);">
            <span class="w-1.5 h-1.5 rounded-full pulse-dot" style="background: var(--live);"></span> AO VIVO
          </span>` : ""}
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-[15px] leading-snug">${n.title}</h3>
          <p class="text-[13px] mt-2 line-clamp-2" style="color: var(--ink-soft);">${n.excerpt}</p>
          <div class="flex items-center justify-between mt-4 font-mono text-[11px]" style="color: var(--muted);">
            <span>${n.author}</span><span>${n.readTimeMin} min</span>
          </div>
        </div>
      `;
      newsGrid.appendChild(card);
    });
  }

  // ===============================================================
  // SETAS DO CARROSSEL — mesmo padrão da home: rola pela largura de
  // um card por clique e desabilita sozinha no início/fim do scroll.
  // ===============================================================
  function initCarouselArrows(track) {
    if (!track) return;
    const prevBtns = document.querySelectorAll(`.js-carousel-prev[data-target="${track.id}"]`);
    const nextBtns = document.querySelectorAll(`.js-carousel-next[data-target="${track.id}"]`);
    function step() {
      const firstCard = track.firstElementChild;
      return (firstCard ? firstCard.getBoundingClientRect().width : 260) + 18;
    }
    function updateArrowState() {
      const maxScroll = track.scrollWidth - track.clientWidth - 2;
      prevBtns.forEach((b) => (b.disabled = track.scrollLeft <= 2));
      nextBtns.forEach((b) => (b.disabled = track.scrollLeft >= maxScroll));
    }
    prevBtns.forEach((b) => b.addEventListener("click", () => track.scrollBy({ left: -step(), behavior: "smooth" })));
    nextBtns.forEach((b) => b.addEventListener("click", () => track.scrollBy({ left: step(), behavior: "smooth" })));
    track.addEventListener("scroll", updateArrowState);
    window.addEventListener("resize", updateArrowState);
    updateArrowState();
    setTimeout(updateArrowState, 50);
  }
  initCarouselArrows(newsGrid);

  const matchesList = document.getElementById("matches-list");
  if (game.matches.length === 0) {
    matchesList.innerHTML = `<p class="font-mono text-[12px] py-2" style="color: var(--muted);">Nenhuma partida agendada no momento.</p>`;
  } else {
    game.matches.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = "flex items-center justify-between py-3";
      if (i > 0) row.style.borderTop = "1px solid var(--border)";
      row.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="text-center w-10 shrink-0">
            <div class="font-mono text-[10px]" style="color: var(--muted);">${m.day}</div>
            <div class="font-mono text-[12px] font-semibold">${m.date}</div>
          </div>
          <div class="text-[13px] font-medium">${m.match}</div>
        </div>
        <span class="font-mono text-[12px]" style="color: var(--muted);">${m.time}</span>
      `;
      matchesList.appendChild(row);
    });
  }

  // ===============================================================
  // MODAL DE NOTÍCIA — Abordagem 1 (SPA / Expansão dinâmica)
  // ===============================================================
  const backdrop   = document.getElementById("news-backdrop");
  const modal      = document.getElementById("news-modal");
  const modalHero  = document.getElementById("modal-hero");
  const modalTag   = document.getElementById("modal-tag");
  const modalLive  = document.getElementById("modal-live");
  const modalTitle = document.getElementById("modal-title");
  const modalAuthor= document.getElementById("modal-author");
  const modalDate  = document.getElementById("modal-date");
  const modalRead  = document.getElementById("modal-read");
  const modalContent = document.getElementById("modal-content");
  const modalGallery = document.getElementById("modal-gallery");
  const modalComments = document.getElementById("modal-comments");
  const modalCommentCount = document.getElementById("modal-comment-count");
  const modalClose = document.getElementById("modal-close");
  const modalFullLink = document.getElementById("modal-full-link");

  // Em produção: n.content (array de parágrafos), n.images e n.comments
  // viriam prontos do CMS/API. Aqui simulamos a partir do excerpt
  // para a notícia funcionar como demo standalone.
  function buildFallbackContent(n) {
    return [
      n.excerpt,
      `A partida teve grande repercussão entre torcedores e analistas da cena de ${game.label}, que destacaram a consistência da equipe ao longo de toda a fase de grupos. Especialistas apontam que o resultado pode reorganizar as apostas para a reta final da temporada.`,
      `Em entrevista após a partida, membros da organização comentaram sobre os ajustes táticos feitos ao longo da semana de preparação, reforçando o trabalho da comissão técnica e a importância dos treinos de scrim contra equipes internacionais.`,
      `O próximo compromisso da equipe já está confirmado no calendário oficial e promete atrair grande audiência nas plataformas de streaming, consolidando ainda mais o interesse do público brasileiro pela modalidade.`,
    ];
  }

  // Gera comentários diferentes por notícia, escolhendo de pools maiores
  // a partir de um hash simples do título — assim cada card sempre
  // mostra a mesma combinação (determinístico), mas distinta das outras.
  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (h * 31 + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  const USERNAMES = [
    "gg_easy", "torcedor_br", "analista_fps", "hypertilt", "zeratoBR",
    "clutch_king", "vareja_pro", "nx_fan92", "riftwatcher", "coach_sombra",
    "manoDoDiscord", "aimlabbr", "gg_wp_only", "banca_de_apostas", "old_school_gamer",
    "pingaltobr", "smurf_do_bem", "casterzin", "flashbang_pro", "spectator01",
    "meta_slayer", "ranked_grind", "fragvideos", "curva_de_dano", "hltv_leitor",
    "primeiro_lugar", "benched_forever", "off_meta", "salahaqui", "tiltproof",
  ];

  const COMMENT_TEMPLATES = [
    (n, g) => `Que jogo intenso, não esperava esse resultado em ${g}!`,
    (n, g) => `${g} está cada vez mais forte no cenário brasileiro, muito orgulho.`,
    (n, g) => `Boa matéria, ${n.author} — só senti falta de mais detalhes sobre a estratégia usada.`,
    (n) => `Comentei isso com a galera no Discord ontem, ninguém acreditava no resultado.`,
    (n, g) => `Já é a segunda vez esse mês que uma notícia de ${g} me surpreende assim.`,
    (n) => `Alguém sabe se vai ter replay/VOD dessa partida?`,
    (n) => `Excelente cobertura, dá pra sentir a emoção só de ler.`,
    (n, g) => `Torcendo forte pro próximo confronto, ${g} merece mais visibilidade.`,
    (n) => `Isso muda completamente as projeções pra reta final da temporada.`,
    (n) => `Falei que ia acontecer isso, só faltou eu apostar kkkk`,
    (n, g) => `Acompanho ${g} desde o início e nunca vi uma virada dessas.`,
    (n) => `Matéria bem escrita, direto ao ponto e sem enrolação.`,
    (n) => `Segunda vez que leio essa notícia e ainda me arrepio, sensacional.`,
    (n, g) => `Comparado com o resto da cena de ${g}, esse nível de jogo tá acima da média.`,
    (n) => `Discordo um pouco da análise, mas respeito o ponto de vista.`,
    (n) => `Só eu que acho que faltou contexto sobre o adversário na matéria?`,
    (n) => `Assisti ao vivo, foi ainda mais emocionante do que o texto descreve.`,
    (n, g) => `${g} definitivamente é o meu jogo favorito pra acompanhar de perto.`,
    (n) => `Vou compartilhar isso no grupo da faculdade, precisam ver.`,
    (n) => `Notícia rápida e direta, exatamente o que eu queria saber.`,
    (n) => `Sinceramente esperava mais repercussão sobre isso nas redes.`,
    (n, g) => `Fico na torcida pra ${g} continuar crescendo assim no Brasil.`,
  ];

  const TIME_LABELS = [
    "3 min atrás", "6 min atrás", "12 min atrás", "18 min atrás", "23 min atrás",
    "29 min atrás", "34 min atrás", "41 min atrás", "48 min atrás", "55 min atrás",
    "1 h atrás", "2 h atrás", "3 h atrás", "5 h atrás", "ontem",
  ];

  function buildFallbackComments(n) {
    const seed = hashString(n.title);
    const count = 3 + (seed % 3); // varia entre 3 e 5 comentários
    const comments = [];
    const usedUsers = new Set();
    for (let i = 0; i < count; i++) {
      let uIdx = (seed + i * 7) % USERNAMES.length;
      // evita repetir o mesmo usuário dentro da mesma notícia
      while (usedUsers.has(uIdx)) uIdx = (uIdx + 1) % USERNAMES.length;
      usedUsers.add(uIdx);

      const tIdx = (seed + i * 13) % COMMENT_TEMPLATES.length;
      const timeIdx = (seed + i * 5) % TIME_LABELS.length;
      comments.push({
        user: USERNAMES[uIdx],
        time: TIME_LABELS[timeIdx],
        text: COMMENT_TEMPLATES[tIdx](n, game.label),
      });
    }
    return comments;
  }

  // Escreve os comentários "de fábrica" (fallback) + os que a pessoa
  // publicou de verdade (persistidos em localStorage) nessa notícia.
  let currentArticleKey = null;
  let currentArticleTitle = "";
  let currentBaseComments = [];

  function renderModalComments() {
    const ownComments = loadStoredComments(currentArticleKey);
    const comments = [...currentBaseComments, ...ownComments];
    modalCommentCount.textContent = comments.length;
    modalComments.innerHTML = comments.map(c => `
      <div class="flex items-start gap-3">
        <div class="comment-avatar">${escapeHtml(c.user.slice(0,2).toUpperCase())}</div>
        <div class="flex-1">
          <div class="flex items-center gap-2 font-mono text-[11px]">
            <span style="color: var(--ink);" class="font-semibold">${escapeHtml(c.user)}</span>
            <span style="color: var(--muted);">${escapeHtml(c.time)}</span>
          </div>
          <p class="text-[13px] mt-1" style="color: var(--ink-soft);">${escapeHtml(c.text)}</p>
        </div>
      </div>
    `).join("");
  }

  function openNewsModal(n, idx) {
    modalFullLink.href = `noticia.html?jogo=${slug}&id=${idx}`;
    modalHero.style.background = `linear-gradient(to bottom right, var(--glow), var(--panel))`;
    modalTag.textContent = game.label.toUpperCase();
    modalLive.classList.toggle("hidden", !n.isLive);
    modalLive.classList.toggle("flex", !!n.isLive);
    modalTitle.textContent = n.title;
    modalAuthor.textContent = `por ${n.author}`;
    modalDate.textContent = n.date || "Hoje";
    modalRead.textContent = `${n.readTimeMin} min de leitura`;

    const paragraphs = n.content || buildFallbackContent(n);
    modalContent.innerHTML = paragraphs.map(p => `<p class="modal-p">${p}</p>`).join("");

    modalGallery.innerHTML = [1, 2].map(i => `
      <div class="h-28 sm:h-36" style="background: linear-gradient(135deg, var(--glow), var(--panel)); border:1px solid var(--border);"></div>
    `).join("");

    currentArticleKey = `${slug}:${idx}`;
    currentArticleTitle = n.title || "";
    currentBaseComments = n.comments || buildFallbackComments(n);
    document.getElementById("modal-comment-input").value = "";
    renderModalComments();

    backdrop.classList.add("open");
    modal.classList.add("open");
    document.body.classList.add("modal-lock");

    // Conta como leitura assim que a pessoa fica alguns segundos com o
    // modal aberto (evita somar progresso pra quem abre e fecha na hora).
    clearTimeout(openNewsModal._readTimer);
    openNewsModal._readTimer = setTimeout(() => {
      markArticleRead(`${slug}:${idx}`, { isLive: !!n.isLive, title: n.title });
    }, 4000);
  }

  function closeNewsModal() {
    clearTimeout(openNewsModal._readTimer);
    backdrop.classList.remove("open");
    modal.classList.remove("open");
    document.body.classList.remove("modal-lock");
  }

  // Delega o clique em cada card gerado dinamicamente para abrir o modal
  newsGrid.addEventListener("click", (e) => {
    const card = e.target.closest("a.clip-card");
    if (!card) return;
    e.preventDefault();
    const idx = Number(card.dataset.index);
    openNewsModal(game.news[idx], idx);
  });

  backdrop.addEventListener("click", closeNewsModal);
  modalClose.addEventListener("click", closeNewsModal);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeNewsModal();
  });

  // ===============================================================
  // PUBLICAR COMENTÁRIO — salva o comentário na notícia atual e soma
  // progresso pro emblema "Comentarista da Arena" (5 comentários).
  // ===============================================================
  const modalCommentInput = document.getElementById("modal-comment-input");
  const modalCommentSubmit = document.getElementById("modal-comment-submit");

  function submitModalComment() {
    const text = modalCommentInput.value.trim();
    if (!text || !currentArticleKey) { modalCommentInput.focus(); return; }
    saveStoredComment(currentArticleKey, { user: "Você", time: "agora", text });
    bumpArenaProgress("newsComments");
    logArenaActivity("💬", `Comentou em "${currentArticleTitle}"`);
    modalCommentInput.value = "";
    renderModalComments();
  }

  modalCommentSubmit.addEventListener("click", submitModalComment);
  modalCommentInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) submitModalComment();
  });
</script>

</body>
