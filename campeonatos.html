<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeonatos | Arena</title>
<meta name="description" content="Chaveamento completo dos principais campeonatos de e-sports — acompanhe rodada por rodada quem avança.">
<link rel="icon" type="image/png" href="https://placehold.co/64x64/14171E/FF4655/png?text=A">
<script src="https://cdn.tailwindcss.com"></script>
<script src="data/utils.js"></script>
<script src="data/social.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data/theme.css">
<style>
  :root{
    --bg: #14171E; --panel: #1B1F28; --panel-2: #20242F; --sidebar: #0F1116;
    --border: rgba(255,255,255,0.08); --ink: #D7DAE1; --ink-soft: #AEB3BE; --muted: #7C8394; --live: #34D399;
    --valorant: #FF4655;  --valorant-glow: #241016;
    --lol: #C89B3C;       --lol-glow: #221d10;
    --cs2: #E8A03D;       --cs2-glow: #241c10;
  }
  html, body{ background: var(--bg); }
  body{ font-family:'Inter', sans-serif; color: var(--ink); }
  .font-display{ font-family:'Teko', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  .clip-tag{ clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%); }
  .pulse-dot{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.45; transform:scale(.75); } }

  .tourney-tab{ border:1px solid var(--border); color: var(--muted); background: var(--panel); white-space:nowrap; }
  .tourney-tab.active{ border-color: var(--card-accent, var(--ink-soft)); color: var(--ink); background: var(--panel-2); }
  .status-pill{ font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; padding:2px 9px; border-radius:999px; letter-spacing:.03em; }
  .status-pill.ao-vivo{ background: rgba(52,211,153,0.14); color: var(--live); }
  .status-pill.em-breve{ background: rgba(255,255,255,0.06); color: var(--ink-soft); }
  .status-pill.encerrado{ background: rgba(255,255,255,0.04); color: var(--muted); }

  /* ===== CHAVEAMENTO ===== */
  #bracket-scroll{ overflow-x:auto; padding-bottom:8px; }
  #bracket-scroll::-webkit-scrollbar{ height:6px; }
  #bracket-scroll::-webkit-scrollbar-thumb{ background: var(--border); border-radius:999px; }
  .bracket{ display:flex; gap:44px; min-width:max-content; padding:6px 2px; }
  .bracket-round{ display:flex; flex-direction:column; justify-content:space-around; gap:18px; width:230px; flex-shrink:0; }
  .round-label{ font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; letter-spacing:.04em; color: var(--muted); text-align:center; margin-bottom:6px; }
  .match-card{ background: var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; position:relative; }
  .match-card.is-live{ border-color: var(--live); box-shadow: 0 0 0 1px var(--live) inset; }
  .match-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 11px; gap:8px; }
  .match-row + .match-row{ border-top:1px solid var(--border); }
  .match-row.is-winner .team-name{ color: var(--ink); font-weight:700; }
  .match-row:not(.is-winner) .team-name{ color: var(--ink-soft); }
  .team-name{ font-size:12.5px; display:flex; align-items:center; gap:7px; min-width:0; }
  .team-logo{ width:22px; height:22px; border-radius:5px; background: var(--panel-2); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:9px; font-weight:700; flex-shrink:0; color: var(--ink-soft); }
  .team-seed{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color: var(--muted); flex-shrink:0; }
  .team-score{ font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; }
  .match-meta{ font-family:'JetBrains Mono', monospace; font-size:10px; color: var(--muted); text-align:center; padding:5px 0 8px; }
  .match-meta.is-live{ color: var(--live); font-weight:700; }
  .team-placeholder{ font-size:12px; color: var(--muted); font-style:italic; }

  /* ===== NOTIFICAÇÕES (reaproveitado do resto do site) ===== */
</style>
</head>
<body>

<header style="border-bottom:1px solid var(--border);">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="index.html" class="font-display text-3xl font-bold tracking-wide shrink-0" style="color: var(--ink);">
      ARENA<span style="color: var(--valorant);">.</span>
    </a>
    <nav class="hidden sm:flex items-center gap-6 font-mono text-[12px] font-semibold">
      <a href="loja.html" style="color: var(--muted);" class="hover:opacity-80">🛍 LOJA</a>
      <a href="campeonatos.html" style="color: var(--ink);" class="hover:opacity-80">🏆 CHAVEAMENTO</a>
      <a href="streamers.html" style="color: var(--muted);" class="hover:opacity-80">🎥 STREAMERS</a>
      <a href="ranking.html" style="color: var(--muted);" class="hover:opacity-80">🏆 RANKING</a>
      <a href="feed.html" style="color: var(--muted);" class="hover:opacity-80">📡 FEED</a>
    </nav>
    <div class="flex items-center gap-3 shrink-0">
      <div class="hidden" id="notif-wrap"></div>
      <a href="index.html" class="font-mono text-[12px] font-semibold flex items-center gap-2 shrink-0" style="color: var(--muted);">
        &larr; Voltar para o portal
      </a>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">

  <div class="mb-8">
    <p class="font-mono text-[11px] font-semibold tracking-wide" style="color: var(--valorant);">🏆 CHAVEAMENTO OFICIAL</p>
    <h1 class="font-display text-4xl sm:text-5xl font-semibold uppercase tracking-wide mt-1">Campeonatos</h1>
    <p class="text-[13px] sm:text-[14px] mt-2 max-w-2xl" style="color: var(--ink-soft);">
      Acompanhe o chaveamento completo dos principais torneios, rodada por rodada, até a grande final.
    </p>
  </div>

  <!-- Abas de campeonato -->
  <div class="flex items-center gap-2 overflow-x-auto pb-1 mb-6" id="tourney-tabs"></div>

  <!-- Cabeçalho do campeonato selecionado -->
  <div id="tourney-header" class="flex flex-wrap items-center justify-between gap-3 mb-6 p-5" style="background: var(--panel); border:1px solid var(--border);"></div>

  <!-- Chaveamento -->
  <div id="bracket-scroll">
    <div class="bracket" id="bracket-root"></div>
  </div>

</main>

<script src="data/campeonatos.js"></script>
<script>
(function(){
  const { getSessionEmail, escapeHtml } = window.ArenaUtils;

  const STATUS_LABEL = { "ao-vivo": "AO VIVO", "em-breve": "EM BREVE", "encerrado": "ENCERRADO" };

  ArenaSocial.initHeaderBell();

  // ===============================================================
  // ABAS — uma por campeonato, ordenadas com "ao vivo" primeiro.
  // ===============================================================
  const sorted = [...CAMPEONATOS].sort((a, b) => {
    const order = { "ao-vivo": 0, "em-breve": 1, "encerrado": 2 };
    return order[a.status] - order[b.status];
  });

  const tabsEl = document.getElementById("tourney-tabs");
  tabsEl.innerHTML = sorted.map(t => `
    <button class="tourney-tab font-mono text-[11px] font-semibold px-3 py-2 rounded-md" data-id="${t.id}" style="--card-accent: var(--${t.game});">
      ${escapeHtml(t.gameLabel.toUpperCase())} ${t.status === "ao-vivo" ? `<span style="color: var(--live);">●</span>` : ""}
    </button>
  `).join("");

  let currentId = sorted[0]?.id;

  function renderHeader(t) {
    document.getElementById("tourney-header").innerHTML = `
      <div>
        <h2 class="font-display text-2xl font-semibold uppercase tracking-wide">${escapeHtml(t.name)}</h2>
        <p class="font-mono text-[11px] mt-1" style="color: var(--muted);">${escapeHtml(t.gameLabel)} · Premiação: ${escapeHtml(t.prizePool)}</p>
      </div>
      <span class="status-pill ${t.status}">${STATUS_LABEL[t.status]}</span>
    `;
  }

  function renderTeamRow(team, score, opponentScore, matchStatus) {
    if (!team) {
      return `<div class="match-row"><span class="team-placeholder">A definir</span></div>`;
    }
    const isWinner = matchStatus === "encerrado" && score !== null && opponentScore !== null && score > opponentScore;
    return `
      <div class="match-row ${isWinner ? "is-winner" : ""}">
        <span class="team-name">
          <span class="team-logo">${escapeHtml(team.logoSeed)}</span>
          <span class="truncate">${escapeHtml(team.name)}</span>
          <span class="team-seed">#${team.seed}</span>
        </span>
        ${score !== null ? `<span class="team-score">${score}</span>` : ""}
      </div>`;
  }

  function renderBracket(t) {
    const root = document.getElementById("bracket-root");
    root.innerHTML = t.rounds.map(round => `
      <div class="bracket-round">
        <div class="round-label">${escapeHtml(round.label.toUpperCase())}</div>
        ${round.matches.map(m => `
          <div class="match-card ${m.status === "ao-vivo" ? "is-live" : ""}">
            ${renderTeamRow(m.teamA, m.scoreA, m.scoreB, m.status)}
            ${renderTeamRow(m.teamB, m.scoreB, m.scoreA, m.status)}
          </div>
          <div class="match-meta ${m.status === "ao-vivo" ? "is-live" : ""}">
            ${m.status === "ao-vivo" ? "🔴 AO VIVO AGORA" : m.status === "agendado" ? (m.time || "A definir") : "Encerrado"}
          </div>
        `).join("")}
      </div>
    `).join("");
  }

  function selectTourney(id) {
    currentId = id;
    const t = CAMPEONATOS.find(c => c.id === id);
    if (!t) return;
    tabsEl.querySelectorAll(".tourney-tab").forEach(btn => btn.classList.toggle("active", btn.dataset.id === id));
    renderHeader(t);
    renderBracket(t);
  }

  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-id]");
    if (!btn) return;
    selectTourney(btn.dataset.id);
  });

  if (currentId) selectTourney(currentId);
})();
</script>
</body>
</html>
