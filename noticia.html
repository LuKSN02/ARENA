<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Notícia — Arena</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171E;
    --panel: #1B1F28;
    --ticker-bg: #0F1116;
    --border: rgba(255,255,255,0.08);
    --ink: #D7DAE1;
    --ink-soft: #AEB3BE;
    --muted: #7C8394;
    --live: #34D399;
    /* --accent / --glow setados via JS conforme game.slug */
    --accent: #7C8394;
    --glow: #171A22;
  }
  html, body{ background: var(--bg); }
  body{ font-family:'Inter', sans-serif; color: var(--ink); }
  .font-display{ font-family:'Teko', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }

  .clip-card{ clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); }
  .clip-tag{ clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%); }
  .pulse-dot{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.45; transform:scale(.75); } }
  .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ===== BARRA DE PROGRESSO DE LEITURA ===== */
  #reading-progress-track{
    position:fixed; top:0; left:0; right:0; height:3px; z-index:70;
    background: rgba(255,255,255,0.06);
  }
  #reading-progress-bar{
    height:100%; width:0%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transition: width .08s linear;
  }

  /* ===== BOTÕES FLUTUANTES DE COMPARTILHAMENTO ===== */
  #share-float{
    position:fixed; z-index:50;
    display:flex; gap:10px;
    left:24px; top:50%; transform:translateY(-50%);
    flex-direction:column;
  }
  .share-btn{
    width:42px; height:42px;
    display:flex; align-items:center; justify-content:center;
    background: var(--panel); border:1px solid var(--border);
    color: var(--ink-soft);
    font-size:16px;
    transition: transform .15s ease, color .15s ease, border-color .15s ease;
  }
  .share-btn:hover{ transform: translateY(-2px); color: var(--accent); border-color: var(--accent); }

  @media (max-width: 1024px){
    #share-float{
      left:0; right:0; top:auto; bottom:0; transform:none;
      flex-direction:row; justify-content:center; gap:14px;
      padding:10px; background: var(--ticker-bg); border-top:1px solid var(--border);
    }
  }

  .article-p{ line-height:1.85; }
</style>
</head>
<body>

<!-- BARRA DE PROGRESSO DE LEITURA -->
<div id="reading-progress-track"><div id="reading-progress-bar"></div></div>

<!-- BOTÕES FLUTUANTES DE COMPARTILHAMENTO -->
<div id="share-float">
  <a id="share-whatsapp" class="share-btn" href="#" target="_blank" rel="noopener" aria-label="Compartilhar no WhatsApp">💬</a>
  <a id="share-x" class="share-btn" href="#" target="_blank" rel="noopener" aria-label="Compartilhar no X">𝕏</a>
  <a id="share-facebook" class="share-btn" href="#" target="_blank" rel="noopener" aria-label="Compartilhar no Facebook">f</a>
  <button id="share-copy" class="share-btn" aria-label="Copiar link">🔗</button>
</div>

<!-- CABEÇALHO -->
<header style="border-bottom:1px solid var(--border);">
  <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
    <a id="back-link" href="home.html" class="font-mono text-[12px]" style="color: var(--muted);">&larr; Voltar</a>
    <nav class="font-mono text-[11px]" style="color: var(--muted);">Notícias / <span id="breadcrumb-game" style="color: var(--ink);">Jogo</span></nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10 lg:pl-24">

  <article id="article-root">
    <span id="article-tag" class="font-mono text-[11px] font-semibold px-3 py-1 inline-block" style="background: var(--accent); color:#12141A;">JOGO</span>

    <h1 id="article-title" class="font-display text-4xl sm:text-5xl font-semibold uppercase tracking-wide mt-4 leading-none"></h1>

    <div class="flex flex-wrap items-center gap-3 mt-4 font-mono text-[11px]" style="color: var(--muted);">
      <span id="article-author"></span>
      <span>•</span>
      <span id="article-date"></span>
      <span>•</span>
      <span id="article-read"></span>
      <span id="article-live" class="hidden items-center gap-1 font-semibold" style="color: var(--live);">
        <span class="w-1.5 h-1.5 rounded-full pulse-dot" style="background: var(--live);"></span> AO VIVO
      </span>
    </div>

    <div class="relative h-64 sm:h-80 mt-6" style="background: linear-gradient(to bottom right, var(--glow), var(--panel)); border:1px solid var(--border);"></div>

    <div id="article-content" class="mt-8 space-y-5 text-[16px] article-p" style="color: var(--ink-soft);"></div>

    <div id="article-gallery" class="grid grid-cols-2 gap-4 mt-8"></div>
  </article>

  <!-- CONTEÚDOS RELACIONADOS -->
  <section class="mt-16 pt-8" style="border-top:1px solid var(--border);">
    <h2 class="font-display text-2xl font-semibold uppercase tracking-wide mb-5">Conteúdos relacionados</h2>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5" id="related-grid"></div>
  </section>

</main>

<script src="data/noticias.js"></script>
<script>
  // ===============================================================
  // Roteamento: noticia.html?jogo=valorant&id=0
  // Em produção seria uma rota de verdade: /noticia/valorant/slug-do-titulo
  // ===============================================================
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("jogo") || "valorant";
  const id = Number(params.get("id") || 0);
  const game = GAMES[slug] || GAMES.valorant;
  const article = game.news[id] || game.news[0];

  document.documentElement.style.setProperty("--accent", game.accent);
  document.documentElement.style.setProperty("--glow", game.glow);

  document.getElementById("page-title").textContent = `${article.title} — Arena`;
  document.getElementById("back-link").href = `jogo.html?jogo=${slug}`;
  document.getElementById("breadcrumb-game").textContent = game.label;
  document.getElementById("article-tag").textContent = game.label.toUpperCase();
  document.getElementById("article-title").textContent = article.title;
  document.getElementById("article-author").textContent = `por ${article.author}`;
  document.getElementById("article-date").textContent = article.date || "Hoje";
  document.getElementById("article-read").textContent = `${article.readTimeMin} min de leitura`;
  if (article.isLive) {
    const liveEl = document.getElementById("article-live");
    liveEl.classList.remove("hidden");
    liveEl.classList.add("flex");
  }

  // Conteúdo do corpo — em produção viria pronto do CMS (article.content)
  const paragraphs = article.content || [
    article.excerpt,
    `A partida teve grande repercussão entre torcedores e analistas da cena de ${game.label}, que destacaram a consistência da equipe ao longo de toda a fase de grupos. Especialistas apontam que o resultado pode reorganizar as apostas para a reta final da temporada.`,
    `Em entrevista após a partida, membros da organização comentaram sobre os ajustes táticos feitos ao longo da semana de preparação, reforçando o trabalho da comissão técnica e a importância dos treinos de scrim contra equipes internacionais.`,
    `O próximo compromisso da equipe já está confirmado no calendário oficial e promete atrair grande audiência nas plataformas de streaming, consolidando ainda mais o interesse do público brasileiro pela modalidade.`,
    `Para os fãs que acompanham de perto o cenário competitivo, a expectativa agora se volta para os próximos confrontos, que devem definir os rumos da temporada regular e as vagas para a fase eliminatória.`,
  ];
  document.getElementById("article-content").innerHTML = paragraphs.map(p => `<p class="article-p">${p}</p>`).join("");

  document.getElementById("article-gallery").innerHTML = [1, 2].map(() => `
    <div class="h-40 sm:h-48" style="background: linear-gradient(135deg, var(--glow), var(--panel)); border:1px solid var(--border);"></div>
  `).join("");

  // ===============================================================
  // BARRA DE PROGRESSO DE LEITURA — baseada no scroll do <article>
  // ===============================================================
  const progressBar = document.getElementById("reading-progress-bar");
  const articleEl = document.getElementById("article-root");

  function updateProgress() {
    const rect = articleEl.getBoundingClientRect();
    const articleTop = rect.top + window.scrollY;
    const articleHeight = articleEl.offsetHeight;
    const viewportH = window.innerHeight;

    const scrolled = window.scrollY - articleTop + viewportH * 0.2;
    const total = articleHeight - viewportH * 0.2;
    const pct = Math.min(100, Math.max(0, (scrolled / total) * 100));
    progressBar.style.width = pct + "%";
  }
  document.addEventListener("scroll", updateProgress, { passive: true });
  window.addEventListener("resize", updateProgress);
  updateProgress();

  // ===============================================================
  // BOTÕES FLUTUANTES DE COMPARTILHAMENTO
  // ===============================================================
  const pageUrl = window.location.href;
  const pageTitle = article.title;

  document.getElementById("share-whatsapp").href = `https://wa.me/?text=${encodeURIComponent(pageTitle + " " + pageUrl)}`;
  document.getElementById("share-x").href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(pageTitle)}&url=${encodeURIComponent(pageUrl)}`;
  document.getElementById("share-facebook").href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`;

  document.getElementById("share-copy").addEventListener("click", async (e) => {
    try {
      await navigator.clipboard.writeText(pageUrl);
      const btn = e.currentTarget;
      const original = btn.textContent;
      btn.textContent = "✓";
      setTimeout(() => (btn.textContent = original), 1500);
    } catch (err) {
      console.warn("Não foi possível copiar o link automaticamente.");
    }
  });

  // ===============================================================
  // CONTEÚDOS RELACIONADOS — 3 notícias (mesmo jogo + fallback global)
  // ===============================================================
  function buildRelated() {
    const pool = [];
    game.news.forEach((n, i) => { if (i !== id) pool.push({ ...n, slug, idx: i }); });

    if (pool.length < 3) {
      Object.entries(GAMES).forEach(([gSlug, g]) => {
        if (gSlug === slug) return;
        g.news.forEach((n, i) => pool.push({ ...n, slug: gSlug, idx: i, otherGameLabel: g.label, otherGameAccent: g.accent, otherGameGlow: g.glow }));
      });
    }
    return pool.slice(0, 3);
  }

  const related = buildRelated();
  const relatedGrid = document.getElementById("related-grid");
  relatedGrid.innerHTML = related.map(n => {
    const label = n.otherGameLabel || game.label;
    const accent = n.otherGameAccent || game.accent;
    const glow = n.otherGameGlow || game.glow;
    return `
      <a href="noticia.html?jogo=${n.slug}&id=${n.idx}" class="clip-card block" style="background: var(--panel); border:1px solid var(--border);">
        <div class="relative h-28" style="background: linear-gradient(to bottom right, ${glow}, var(--panel));">
          <span class="clip-tag absolute top-0 left-0 font-mono text-[10px] font-semibold px-3 py-1" style="background: ${accent}; color:#12141A;">${label.toUpperCase()}</span>
        </div>
        <div class="p-3">
          <h3 class="font-semibold text-[13px] leading-snug line-clamp-2">${n.title}</h3>
          <div class="flex items-center justify-between mt-3 font-mono text-[10px]" style="color: var(--muted);">
            <span>${n.author}</span><span>${n.readTimeMin} min</span>
          </div>
        </div>
      </a>
    `;
  }).join("");
</script>

</body>
</html>
